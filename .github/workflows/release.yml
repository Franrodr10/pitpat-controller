name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish, e.g. v0.1.0-beta.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      # A final version signed with a throwaway debug key could never be updated in place.
      - name: Final versions need the signing key
        if: env.HAS_SIGNING_KEY != 'true' && !contains(env.TAG, '-')
        run: |
          echo "::error::$TAG es una versión final y falta la clave de firma. Añade los secretos de docs/RELEASING.md y vuelve a ejecutar este workflow."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK from the command line
        run: |
          ./tools/setup-android-sdk.sh "$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Restore the signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --stacktrace

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="pitpat-controller-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The release notes are this version's section of CHANGELOG.md, if it has one.
          notes=$(awk -v version="${TAG#v}" '/^## /{ found = index($0, "[" version "]") > 0; next } found' CHANGELOG.md)
          nl=$'\n\n'
          notes="${notes:+$notes$nl}APK para Android 8 o posterior: descárgalo desde el móvil y ábrelo para instalarlo."
          if [[ "$HAS_SIGNING_KEY" != "true" ]]; then
            notes+="${nl}Firmado con una clave de depuración: para instalar después una versión firmada habrá que desinstalar esta antes."
          fi
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "PitPat Controller $TAG" --notes "$notes" "${flags[@]}"
