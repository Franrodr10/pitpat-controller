name: Web

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Never cut a GitHub Pages deployment of main halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type check (JSDoc)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: End-to-end tests with a simulated treadmill
        env:
          PITPAT_E2E_CHANNEL: chrome # the runner's Chrome, so no browser download
        run: npm run test:e2e

  # Publishes web/app at https://franrodr10.github.io/pitpat-controller/
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the version
        run: |
          version="$(date -u +%Y-%m-%d) (${GITHUB_SHA::7})"
          sed -i "s/^export const VERSION = .*/export const VERSION = '$version';/" web/app/js/version.js
          grep -q "$version" web/app/js/version.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/app

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Check that the page serves this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # GitHub Pages can take a minute to serve a new deployment; the query skips its cache.
          for attempt in $(seq 1 18); do
            if curl -fsS "${PAGE_URL}js/version.js?run=$GITHUB_RUN_ID-$attempt" | grep -qF "${GITHUB_SHA::7}"; then
              curl -fsS "${PAGE_URL}?run=$GITHUB_RUN_ID" | grep -qF '<title>PitPat Controller</title>'
              echo "En línea: $PAGE_URL (${GITHUB_SHA::7})"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PAGE_URL no sirve todavía el commit ${GITHUB_SHA::7}"
          exit 1
